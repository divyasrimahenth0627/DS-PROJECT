<!DOCTYPE html>
<html>
<head>
    <title>Plan My Trip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>✈️ Plan My Trip</h1>
        <p>Budget Itinerary Generator</p>

        <label>Destination</label>
        <input type="text" id="destination" placeholder="Enter destination">

        <label>Number of Days</label>
        <input type="number" id="days" placeholder="Enter days">

        <label>Budget (₹)</label>
        <input type="number" id="budget" placeholder="Enter budget">

        <button onclick="planTrip()">Plan My Trip</button>

        <div id="result"></div>
    </div>

    <script>
        function planTrip() {
            let destination = document.getElementById("destination").value;
            let days = document.getElementById("days").value;
            let budget = document.getElementById("budget").value;

            if (destination == "" || days == "" || budget == "") {
                alert("Please enter all details!");
                return;
            }

            let dailyBudget = budget / days;

            document.getElementById("result").innerHTML =
                "<h2>🌍 Your Trip Plan</h2>" +
                "<p><b>Destination:</b> " + destination + "</p>" +
                "<p><b>Duration:</b> " + days + " days</p>" +
                "<p><b>Total Budget:</b> ₹" + budget + "</p>" +
                "<p><b>Daily Budget:</b> ₹" + dailyBudget.toFixed(2) + "</p>" +
                "<h3>📅 Itinerary</h3>" +
                "<p>Day 1: Explore popular places in " + destination + "</p>" +
                "<p>Day 2: Visit tourist attractions</p>" +
                "<p>Day 3: Try local food and shopping</p>" +
                "<p>Day 4: Relax and explore nearby places</p>";
        }
    </script>

</body>
</html>
